name: Subah ki Crypto Report

on:
  schedule:
    - cron: "0 0 * * *"   # 00:00 UTC = Pakistan mein subah 5:00
  workflow_dispatch:
    inputs:
      mode:
        description: "morning ya test"
        default: "morning"

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Report bhejein
        run: python report.py "${{ github.event.inputs.mode || 'morning' }}"
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
