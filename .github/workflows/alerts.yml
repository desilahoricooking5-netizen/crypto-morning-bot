name: BTC Foran Alerts

on:
  schedule:
    - cron: "*/15 * * * *"   # har 15 minute
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: btc-alerts
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Alert check
        run: python run.py alert
        env:
          RESEND_API_KEY: ${{ secrets.DESICRYPTOBOT }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
      - name: State save karein
        run: |
          git config user.name "crypto-bot"
          git config user.email "crypto-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "state update" && git push)
